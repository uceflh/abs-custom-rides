<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1B17">
<title>Garage OS · ABS Custom Rides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rye&family=Oswald:wght@400;500;600&family=Barlow:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="brand/mark-wheel-light.png">
</head>
<body class="app-body">
<div class="paper-grain" aria-hidden="true"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation principale"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Ouvrir le menu" aria-controls="side" aria-expanded="false"></button>
      <div class="search" role="search">
        <label class="sr-only" for="q">Rechercher un client, un véhicule, un OR</label>
        <span id="qIcon"></span>
        <input id="q" type="search" placeholder="Client, véhicule, OR, facture" autocomplete="off">
        <div class="search-res" id="qRes"></div>
      </div>
      <span class="demo-tag">Démo · données fictives</span>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation rapide"></nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
